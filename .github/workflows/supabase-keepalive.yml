# Batida diária no banco, para o Supabase não pausar o projeto por inatividade.
#
# No plano Free, projeto sem atividade de banco por cerca de uma semana é
# pausado — e projeto pausado é o que, lá na frente, corre risco de sumir.
#
# ANTES DE FUNCIONAR: rode supabase/migrations/20260825120000_keepalive.sql no
# SQL Editor do Supabase. Sem isso a função não existe e esta rotina falha
# (avisando).
#
# A URL e a chave abaixo são as mesmas do .env do projeto — a chave publishable
# é pública por natureza, vai embutida no site que qualquer visitante baixa;
# quem protege os dados é o RLS. Para apontar para outro projeto, defina as
# variáveis SUPABASE_URL / SUPABASE_ANON_KEY em Settings → Secrets and
# variables → Actions → Variables.
#
# Se o projeto estiver pausado ou fora do ar, o job falha e o GitHub manda
# e-mail — que é exatamente o aviso que se quer receber.
name: Keep-alive do Supabase

on:
  schedule:
    # 09:20 UTC = 06:20 em Brasília, todo dia.
    - cron: '20 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  batida:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Registrar atividade no banco
        env:
          URL: ${{ vars.SUPABASE_URL || 'https://jjkmgkorqzbroebhksca.supabase.co' }}
          CHAVE: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_PNmCu11Hdy5YDOFDn2sedA_VcfLdppn' }}
        run: |
          curl --fail-with-body -sS -X POST "$URL/rest/v1/rpc/registrar_keepalive" \
            -H "apikey: $CHAVE" \
            -H "Authorization: Bearer $CHAVE" \
            -H "Content-Type: application/json" \
            -d '{"p_origem":"github-actions"}'
          echo
